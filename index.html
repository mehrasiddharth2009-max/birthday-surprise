<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>A Special Birthday Surprise 🎂</title>

<style>

/* =========================
   BASIC RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    color-scheme:light;
}

html{
    color-scheme:light;
    -webkit-text-size-adjust:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#09050a;
    color:white;
    font-family:Arial,sans-serif;
    forced-color-adjust:none;
    -webkit-font-smoothing:antialiased;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#09050a;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:opacity .8s ease,visibility .8s ease;
}

.loader{
    width:82px;
    height:82px;
    border-radius:50%;
    border:8px solid rgba(255,255,255,.15);
    border-top-color:#ff4f81;
    animation:spin 1s linear infinite;
}

#loading h2{
    margin-top:25px;
    font-size:24px;
    text-align:center;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* =========================
   MAIN PAGE
========================= */

#mainPage{
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#2a0b1b,#09050a 65%);
}

/* =========================
   FAIRY LIGHTS
========================= */

.fairyLights{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:0 15px;
    z-index:5;
}

.bulb{
    width:17px;
    height:17px;
    border-radius:50%;
    background:#343038 !important;
    transition:.5s;
}

.fairyLights.on .bulb{
    background:#ffe48a !important;
    box-shadow:
    0 0 10px #ffd54f,
    0 0 25px #ffca28,
    0 0 42px #ffb300;
}

/* =========================
   MAIN BUTTON
========================= */

.mainBtn{
    position:absolute;
    top:105px;
    left:50%;
    transform:translateX(-50%);
    border:none;
    border-radius:50px;
    padding:16px 34px;
    font-size:18px;
    background:#ff4778 !important;
    color:white !important;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(255,71,120,.4);
    z-index:20;
}

.mainBtn:active{
    transform:translateX(-50%) scale(.96);
}

/* =========================
   MUSIC BUTTON
========================= */

#musicBtn{
    position:fixed;
    top:15px;
    right:15px;
    z-index:500;
    border:none;
    border-radius:50px;
    padding:10px 15px;
    background:rgba(255,71,120,.9) !important;
    color:white !important;
    font-size:14px;
    cursor:pointer;
}

/* =========================
   BIRTHDAY TITLE
========================= */

#birthdayTitle{
    display:none;
    position:absolute;
    top:27%;
    width:100%;
    padding:0 15px;
    text-align:center;
    font-family:cursive;
    font-size:58px;
    color:#ff6390 !important;
    text-shadow:
    0 0 12px rgba(255,99,144,.5),
    0 0 30px rgba(255,99,144,.25);
    animation:titleFloat 2s ease-in-out infinite;
    z-index:10;
}

@keyframes titleFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

/* =========================
   GIFT
========================= */

#giftBox{
    display:none;
    position:absolute;
    top:48%;
    left:50%;
    transform:translateX(-50%);
    width:145px;
    height:125px;
    cursor:pointer;
    animation:giftFloat 1.8s ease-in-out infinite;
    z-index:15;
}

.giftBody{
    position:absolute;
    bottom:0;
    width:145px;
    height:98px;
    background:linear-gradient(to bottom,#ff5e88,#d81e56) !important;
    border-radius:12px;
    box-shadow:0 12px 25px rgba(0,0,0,.4);
}

.giftRibbon{
    position:absolute;
    left:62px;
    top:0;
    width:20px;
    height:125px;
    background:#ffe18a !important;
    z-index:2;
}

.giftLid{
    position:absolute;
    top:8px;
    left:-7px;
    width:159px;
    height:35px;
    background:#ff7a9d !important;
    border-radius:10px;
    z-index:3;
    transition:.7s;
}

#giftBox.open .giftLid{
    transform:translateY(-55px) rotate(-12deg);
}

@keyframes giftFloat{
    0%,100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(-10px);}
}

/* =========================
   GIFT MESSAGE
========================= */

#giftMessage{
    display:none;
    position:absolute;
    top:70%;
    width:100%;
    text-align:center;
    font-size:18px;
    color:#ffd9e4;
    animation:fadeUp .8s ease forwards;
    z-index:20;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   CAKE AREA
========================= */

#cakeArea{
    display:none;
    position:absolute;
    top:39%;
    left:50%;
    width:300px;
    transform:translateX(-50%);
    flex-direction:column;
    align-items:center;
    z-index:30;
}

#cakeArea.show{
    display:flex;
}

/* =========================
   CAKE
========================= */

.cake{
    position:relative;
    width:180px;
    height:190px;
    animation:cakeFloat 2.5s ease-in-out infinite;
}

.cakeLeft{
    position:absolute;
    left:0;
    bottom:0;
    width:180px;
    height:190px;
    transition:transform .9s ease;
}

.cakeBottom{
    position:absolute;
    bottom:0;
    width:180px;
    height:68px;
    background:linear-gradient(to bottom,#a94b2f,#6e2418) !important;
    border-radius:0 0 25px 25px;
    box-shadow:
    0 12px 18px rgba(0,0,0,.45),
    inset 0 -8px 10px rgba(0,0,0,.18);
}

.cakeMiddle{
    position:absolute;
    bottom:60px;
    left:10px;
    width:160px;
    height:55px;
    background:linear-gradient(to bottom,#f6b6a8,#d87b6d) !important;
    border-radius:16px;
}

.cakeTop{
    position:absolute;
    bottom:108px;
    left:22px;
    width:136px;
    height:44px;
    background:linear-gradient(to bottom,#fff4d6,#f0c97c) !important;
    border-radius:20px;
}

.candle{
    position:absolute;
    bottom:147px;
    left:84px;
    width:13px;
    height:40px;
    border-radius:6px;
    background:
    repeating-linear-gradient(
        45deg,
        white 0 5px,
        #ff5c8a 5px 10px
    ) !important;
    z-index:5;
}

.flame{
    position:absolute;
    bottom:182px;
    left:79px;
    width:23px;
    height:32px;
    background:
    radial-gradient(
        circle at 50% 65%,
        white 0 15%,
        #ffd54f 30%,
        #ff9800 65%,
        #ff5722 100%
    ) !important;
    border-radius:60% 60% 55% 55%;
    box-shadow:0 0 20px #ff9800;
    animation:flame .5s infinite alternate;
    z-index:6;
}

@keyframes cakeFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-7px);}
}

@keyframes flame{
    to{
        transform:scale(1.12) rotate(3deg);
    }
}

/* =========================
   CAKE SLICE
========================= */

.cakeSlice{
    position:absolute;
    right:0;
    bottom:0;
    width:58px;
    height:112px;
    opacity:0;
    transform:translateX(0);
    transition:
    transform .9s ease,
    opacity .3s ease;
    z-index:10;
}

.sliceBottom{
    position:absolute;
    bottom:0;
    left:0;
    width:58px;
    height:68px;
    background:linear-gradient(to bottom,#a94b2f,#6e2418) !important;
    border-radius:0 0 24px 8px;
    box-shadow:0 10px 15px rgba(0,0,0,.35);
}

.sliceMiddle{
    position:absolute;
    bottom:60px;
    left:0;
    width:58px;
    height:55px;
    background:linear-gradient(to bottom,#f6b6a8,#d87b6d) !important;
    border-radius:12px 0 0 12px;
}

.sliceTop{
    position:absolute;
    bottom:108px;
    left:0;
    width:58px;
    height:44px;
    background:linear-gradient(to bottom,#fff4d6,#f0c97c) !important;
    border-radius:15px 0 0 15px;
}

.cake.cut{
    animation:none;
}

.cake.cut .cakeLeft{
    transform:translateX(-18px);
}

.cake.cut .cakeSlice{
    opacity:1;
    transform:
    translateX(78px)
    translateY(12px)
    rotate(8deg);
}

.cake.cut .cakeBottom,
.cake.cut .cakeMiddle,
.cake.cut .cakeTop{
    clip-path:polygon(
        0 0,
        68% 0,
        68% 100%,
        0 100%
    );
}

/* =========================
   CUT BUTTON
========================= */

#cutBtn{
    margin-top:28px;
    border:none;
    border-radius:50px;
    padding:16px 40px;
    font-size:19px;
    background:#ff4778 !important;
    color:white !important;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(255,71,120,.4);
    z-index:40;
}

/* =========================
   WISH BUTTON
========================= */

#wishBtn{
    display:none;
    margin-top:20px;
    border:none;
    border-radius:50px;
    padding:14px 32px;
    font-size:18px;
    background:#ffd166 !important;
    color:#4a2500 !important;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(255,209,102,.35);
}

/* =========================
   CELEBRATION TEXT
========================= */

#celebrateText{
    display:none;
    position:absolute;
    top:18%;
    width:100%;
    text-align:center;
    font-size:25px;
    color:#ffe6ef;
    z-index:50;
    animation:fadeUp .8s ease;
}

/* =========================
   LETTER PAGE
========================= */

#letterPage{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    overflow-y:auto;
    padding:35px 18px;
    background:
    radial-gradient(circle at top,#3a1028,#09050a 70%);
}

.letterCard{
    width:100%;
    max-width:650px;
    margin:20px auto;
    padding:30px 24px;
    border-radius:25px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 15px 45px rgba(0,0,0,.45);
    backdrop-filter:blur(10px);
}

.letterCard h1{
    text-align:center;
    color:#ff739a !important;
    font-family:cursive;
    font-size:42px;
    margin-bottom:25px;
}

.letterText{
    font-size:18px;
    line-height:1.8;
    color:#fff7fa !important;
    white-space:pre-line;
    min-height:350px;
}

.nextBtn{
    display:block;
    margin:28px auto 0;
    border:none;
    border-radius:40px;
    padding:14px 30px;
    background:#ff4778 !important;
    color:white !important;
    font-size:17px;
    cursor:pointer;
}

/* =========================
   BALLOONS
========================= */

.balloon{
    position:fixed;
    bottom:-120px;
    width:45px;
    height:58px;
    border-radius:50%;
    opacity:.85;
    z-index:105;
    animation:balloonUp 7s linear forwards;
}

.balloon:after{
    content:"";
    position:absolute;
    width:1px;
    height:65px;
    background:rgba(255,255,255,.5);
    left:50%;
    top:55px;
}

@keyframes balloonUp{
    0%{
        transform:translateY(0) rotate(0);
    }
    100%{
        transform:translateY(-120vh) rotate(15deg);
    }
}

/* =========================
   FINAL PAGE
========================= */

#finalPage{
    display:none;
    position:fixed;
    inset:0;
    z-index:200;
    overflow:hidden;
    background:
    radial-gradient(circle,#42132e,#09050a 70%);
    align-items:center;
    justify-content:center;
    text-align:center;
}

#fireworks{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.finalCard{
    position:relative;
    z-index:5;
    max-width:620px;
    margin:20px;
    padding:45px 25px;
    border-radius:28px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 15px 50px rgba(0,0,0,.5);
    opacity:0;
    transform:translateY(25px);
    transition:1s ease;
}

.finalCard.show{
    opacity:1;
    transform:translateY(0);
}

.finalCard h1{
    font-family:cursive;
    font-size:45px;
    color:#ff779f !important;
    line-height:1.25;
    margin-bottom:25px;
}

.finalCard p{
    font-size:22px;
    line-height:1.7;
    color:#fff5f8 !important;
}

.signature{
    margin-top:30px;
    font-size:21px;
    color:#ffd6e2 !important;
}

.heart{
    font-size:65px;
    margin-top:20px;
    animation:heartBeat 1s infinite;
}

@keyframes heartBeat{
    50%{transform:scale(1.18);}
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    #birthdayTitle{
        font-size:48px;
        top:28%;
    }

    #giftBox{
        top:49%;
    }

    #cakeArea{
        top:40%;
    }

    .letterCard{
        padding:25px 18px;
    }

    .letterCard h1{
        font-size:36px;
    }

    .letterText{
        font-size:16px;
    }

    .finalCard h1{
        font-size:38px;
    }

    .finalCard p{
        font-size:19px;
    }

    #celebrateText{
        font-size:21px;
    }

}

</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="loader"></div>

    <h2>Preparing Your Surprise 💗</h2>

</div>


<!-- =========================
     MAIN PAGE
========================= -->

<div id="mainPage">

    <div class="fairyLights" id="fairyLights">

        <div class="bulb"></div>
        <div class="bulb"></div>
        <div class="bulb"></div>
        <div class="bulb"></div>
        <div class="bulb"></div>
        <div class="bulb"></div>
        <div class="bulb"></div>
        <div class="bulb"></div>
        <div class="bulb"></div>
        <div class="bulb"></div>

    </div>


    <button id="musicBtn">
        🎵 Music
    </button>


    <button id="lightBtn" class="mainBtn">
        Turn On Lights ✨
    </button>


    <h1 id="birthdayTitle">
        Happy Birthday 🎂
    </h1>


    <!-- GIFT -->

    <div id="giftBox">

        <div class="giftBody"></div>

        <div class="giftRibbon"></div>

        <div class="giftLid"></div>

    </div>


    <div id="giftMessage">
        Wait... there's something more for you 👀✨
    </div>


    <!-- CAKE -->

    <div id="cakeArea">

        <div class="cake" id="cake">

            <div class="cakeLeft">

                <div class="cakeBottom"></div>

                <div class="cakeMiddle"></div>

                <div class="cakeTop"></div>

            </div>


            <div class="cakeSlice">

                <div class="sliceBottom"></div>

                <div class="sliceMiddle"></div>

                <div class="sliceTop"></div>

            </div>


            <div class="candle"></div>

            <div class="flame" id="flame"></div>

        </div>


        <button id="cutBtn">
            Cut Cake 🎂
        </button>


        <button id="wishBtn">
            Make a Wish ✨
        </button>

    </div>


    <div id="celebrateText">
        Yay! 🎉 Make a wish! ✨
    </div>

</div>


<!-- =========================
     LETTER PAGE
========================= -->

<div id="letterPage">

    <div class="letterCard">

        <h1>
            Happy Birthdayyy! 🎂🥳🤍
        </h1>


        <div class="letterText" id="letterText"></div>


        <button id="nextBtn" class="nextBtn">
            One More Thing 💌
        </button>

    </div>

</div>


<!-- =========================
     FINAL PAGE
========================= -->

<div id="finalPage">

    <canvas id="fireworks"></canvas>


    <div class="finalCard" id="finalCard">

        <h1>
            Some people become special<br>
            without even trying...
        </h1>


        <p>
            Thank you for being one of them.
        </p>


        <div class="signature">

            With warm wishes,<br><br>

            — Siddharth

        </div>


        <div class="heart">
            💖
        </div>

    </div>

</div>


<script>

/* =====================================================
   LOADING
===================================================== */

setTimeout(function(){

    const loading = document.getElementById("loading");

    loading.style.opacity = "0";
    loading.style.visibility = "hidden";

    setTimeout(function(){

        loading.style.display = "none";

    },800);

},1800);


/* =====================================================
   ELEMENTS
===================================================== */

const lightBtn = document.getElementById("lightBtn");
const fairyLights = document.getElementById("fairyLights");
const birthdayTitle = document.getElementById("birthdayTitle");
const giftBox = document.getElementById("giftBox");
const giftMessage = document.getElementById("giftMessage");
const cakeArea = document.getElementById("cakeArea");
const cutBtn = document.getElementById("cutBtn");
const wishBtn = document.getElementById("wishBtn");
const cake = document.getElementById("cake");
const flame = document.getElementById("flame");
const celebrateText = document.getElementById("celebrateText");
const letterPage = document.getElementById("letterPage");
const letterText = document.getElementById("letterText");
const nextBtn = document.getElementById("nextBtn");
const finalPage = document.getElementById("finalPage");
const finalCard = document.getElementById("finalCard");
const musicBtn = document.getElementById("musicBtn");


/* =====================================================
   LIGHTS
===================================================== */

lightBtn.onclick = function(){

    fairyLights.classList.add("on");

    birthdayTitle.style.display = "block";

    lightBtn.style.display = "none";

    giftBox.style.display = "block";

};


/* =====================================================
   GIFT
===================================================== */

giftBox.onclick = function(){

    giftBox.classList.add("open");

    setTimeout(function(){

        giftBox.style.display = "none";

        giftMessage.style.display = "block";

    },500);


    setTimeout(function(){

        giftMessage.style.display = "none";

        cakeArea.classList.add("show");

    },1800);

};


/* =====================================================
   CAKE CUT
===================================================== */

cutBtn.onclick = function(){

    cake.classList.add("cut");

    cutBtn.style.display = "none";

    celebrateText.style.display = "block";

    createBalloons();

    setTimeout(function(){

        wishBtn.style.display = "block";

    },900);

};


/* =====================================================
   MAKE A WISH
===================================================== */

wishBtn.onclick = function(){

    flame.style.display = "none";

    wishBtn.style.display = "none";

    celebrateText.innerHTML = "Wish made! ✨🎈";

    createBalloons();

    setTimeout(function(){

        letterPage.style.display = "block";

        startTyping();

    },1800);

};


/* =====================================================
   LETTER
===================================================== */

const letterContent =
`Today is a very special day—not only for you, but for me as well, because it’s your birthday. And if this day had never come, I might never have found such a wonderful friend like you. 🤍

I genuinely wish that your life is always filled with happiness, peace, and beautiful moments. May your smile never fade, and may every dream you have come true, one by one. Always stay the kind, sensible, and lovely person you are. ✨

I have just one wish for you—always stay happy, take good care of yourself, and never lose your beautiful smile. 🎈 May every new year of your life bring you even more happiness, success, peace, and unforgettable memories.

Once again, Happy Birthdayyy! 🎂🥳💛

May this year bring you everything that truly makes you happy. 🤍`;


let typingStarted = false;

function startTyping(){

    if(typingStarted) return;

    typingStarted = true;

    letterText.innerHTML = "";

    let i = 0;

    function type(){

        if(i < letterContent.length){

            letterText.innerHTML += letterContent.charAt(i);

            i++;

            setTimeout(type,18);

        }

    }

    type();

}


/* =====================================================
   FINAL PAGE
===================================================== */

nextBtn.onclick = function(){

    letterPage.style.display = "none";

    finalPage.style.display = "flex";

    setTimeout(function(){

        finalCard.classList.add("show");

        startFireworks();

    },500);

};


/* =====================================================
   BALLOONS
===================================================== */

function createBalloons(){

    for(let i=0;i<8;i++){

        const balloon = document.createElement("div");

        balloon.className = "balloon";

        balloon.style.left =
        Math.random()*95 + "%";

        balloon.style.background =
        "hsl(" + (Math.random()*360) + ",85%,65%)";

        balloon.style.animationDelay =
        (Math.random()*1.5) + "s";

        document.body.appendChild(balloon);


        setTimeout(function(){

            balloon.remove();

        },9000);

    }

}


/* =====================================================
   FIREWORKS
===================================================== */

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];

function resizeCanvas(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);


function createFirework(x,y){

    for(let i=0;i<45;i++){

        const angle =
        Math.PI * 2 * i / 45;

        const speed =
        Math.random()*4 + 2;

        particles.push({

            x:x,
            y:y,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            life:70,

            color:
            "hsl(" +
            Math.random()*360 +
            ",100%,70%)"

        });

    }

}


function drawFireworks(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(function(p){

        p.x += p.vx;

        p.y += p.vy;

        p.vy += .035;

        p.life--;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            2,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        p.color;

        ctx.fill();

    });


    particles =
    particles.filter(function(p){

        return p.life > 0;

    });


    requestAnimationFrame(drawFireworks);

}


function startFireworks(){

    drawFireworks();

    setInterval(function(){

        createFirework(
            Math.random()*canvas.width,
            Math.random()*canvas.height*.55
        );

    },900);

}


/* =====================================================
   SIMPLE BUILT-IN MUSIC
   No audio file required
===================================================== */

let audioContext = null;
let musicPlaying = false;
let musicTimer = null;

const notes = [
    261.63,
    329.63,
    392.00,
    329.63,
    293.66,
    349.23,
    440.00,
    349.23
];

function playNote(freq){

    if(!audioContext) return;

    const oscillator =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = freq;

    gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .035,
        audioContext.currentTime+.05
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime+.7
    );

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime+.75
    );

}


function startMusic(){

    if(!audioContext){

        audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    }

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }

    let index = 0;

    musicTimer =
    setInterval(function(){

        playNote(notes[index]);

        index++;

        if(index >= notes.length){

            index = 0;

        }

    },800);

    musicPlaying = true;

    musicBtn.innerHTML =
    "🎵 Music ON";

}


function stopMusic(){

    clearInterval(musicTimer);

    musicPlaying = false;

    musicBtn.innerHTML =
    "🎵 Music";

}


musicBtn.onclick = function(){

    if(musicPlaying){

        stopMusic();

    }else{

        startMusic();

    }

};

</script>
